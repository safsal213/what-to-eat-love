<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7a3d24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="מה בא לך?">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>מה בא לך לאכול אהובתי?</title>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">בשביל מעיין ❤️</p>
      <h1 id="appTitle">מה בא לך לאכול?</h1>
    </div>
    <button id="backBtn" class="icon-btn hidden" type="button" aria-label="חזרה">←</button>
  </header>

  <main class="app-shell">
    <section id="loadingView" class="status-card">
      <div class="spinner" aria-hidden="true"></div>
      <h2>טוען את התפריט…</h2>
      <p>עוד רגע הכול מוכן</p>
    </section>

    <section id="errorView" class="status-card hidden">
      <div class="status-emoji">😕</div>
      <h2>לא הצלחנו לטעון</h2>
      <p id="errorText">בדוק את החיבור ונסה שוב.</p>
      <button id="retryBtn" class="primary-btn" type="button">נסה שוב</button>
    </section>

    <section id="categoriesView" class="hidden">
      <div class="section-heading">
        <h2>בחרי ארוחה</h2>
      </div>
      <div id="categoriesGrid" class="grid"></div>
    </section>

    <section id="mealsView" class="hidden">
      <div class="section-heading">
        <h2 id="mealsTitle">מנות</h2>
        <button id="surpriseBtn" class="secondary-btn" type="button">🎲 תפתיע אותי</button>
      </div>
      <div id="mealsGrid" class="grid"></div>
      <p id="emptyMeals" class="empty-message hidden">אין כרגע מנות בקטגוריה הזאת.</p>
    </section>

    <section id="choiceView" class="hidden">
      <article class="choice-card">
        <p class="eyebrow">הבחירה של מעיין</p>
        <div class="choice-image-wrap">
          <img id="choiceImage" alt="">
          <span id="choiceEmoji" class="choice-emoji">🍽️</span>
        </div>
        <h2 id="choiceName"></h2>
        <p id="choiceDescription"></p>
        <div id="choiceMeta" class="meta-row"></div>
        <button id="confirmBtn" class="primary-btn" type="button">בא לי את זה ❤️</button>
      </article>
    </section>

    <section id="successView" class="status-card hidden">
      <div class="success-icon">✓</div>
      <h2>הבחירה נשמרה</h2>
      <p id="successText"></p>
      <button id="homeBtn" class="primary-btn" type="button">לבחירה חדשה</button>
    </section>
  </main>

  <template id="cardTemplate">
    <button class="food-card" type="button">
      <div class="image-wrap">
        <img alt="">
        <span class="fallback-emoji">🍽️</span>
      </div>
      <div class="card-content">
        <h3></h3>
        <p></p>
      </div>
    </button>
  </template>

  <script type="module" src="js/app.js"></script>
</body>
</html>
