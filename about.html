<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7a3d24">
  <title>אודות — מה בא לך לאכול?</title>
  <style>
    :root {
      color-scheme: light;
      --bg:#fff9f5;
      --surface:rgba(255,255,255,.94);
      --text:#2b1a14;
      --muted:#756159;
      --accent:#c75b39;
      --accent-dark:#8c3c26;
      --shadow:0 18px 48px rgba(71,34,21,.14);
    }
    * { box-sizing:border-box; }
    body {
      min-height:100dvh;
      margin:0;
      display:grid;
      place-items:center;
      padding:max(22px,env(safe-area-inset-top))
              max(18px,env(safe-area-inset-right))
              max(22px,env(safe-area-inset-bottom))
              max(18px,env(safe-area-inset-left));
      font-family:Arial,"Noto Sans Hebrew",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 20% 15%,rgba(255,215,191,.58),transparent 30%),
        radial-gradient(circle at 82% 76%,rgba(247,196,179,.42),transparent 32%),
        var(--bg);
    }
    main {
      width:min(100%,460px);
      padding:28px 22px;
      border:1px solid rgba(123,67,43,.07);
      border-radius:28px;
      background:var(--surface);
      box-shadow:var(--shadow);
      text-align:center;
      backdrop-filter:blur(14px);
    }
    .logo {
      width:78px;
      height:78px;
      display:grid;
      place-items:center;
      margin:0 auto 16px;
      border-radius:26px;
      background:#fff;
      box-shadow:0 12px 28px rgba(71,34,21,.10);
      font-size:40px;
    }
    .eyebrow {
      margin:0 0 5px;
      color:var(--accent-dark);
      font-size:13px;
      font-weight:800;
    }
    h1 {
      margin:0;
      font-size:30px;
      letter-spacing:-.03em;
    }
    .subtitle {
      margin:8px 0 22px;
      color:var(--muted);
      line-height:1.55;
    }
    .info {
      display:grid;
      gap:10px;
      margin:0 0 20px;
      text-align:right;
    }
    .row {
      display:flex;
      justify-content:space-between;
      gap:16px;
      padding:12px 14px;
      border-radius:16px;
      background:rgba(255,244,237,.86);
    }
    .row span { color:var(--muted); }
    .row strong { text-align:left; overflow-wrap:anywhere; }
    .back {
      width:100%;
      min-height:48px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:16px;
      background:linear-gradient(180deg,#d36b47,#b94830);
      color:#fff;
      text-decoration:none;
      font-weight:900;
      box-shadow:0 10px 22px rgba(185,72,48,.22);
    }
    footer {
      margin-top:18px;
      color:var(--muted);
      font-size:12px;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">❤️</div>
    <p class="eyebrow">האפליקציה של חיים ומעיין</p>
    <h1>מה בא לך לאכול?</h1>
    <p class="subtitle">בוחרים משהו טעים ביחד — באהבה ובכיף.</p>

    <section class="info" aria-label="פרטי גרסה">
      <div class="row"><span>גרסה</span><strong>1.0.0 RC‑01</strong></div>
      <div class="row"><span>ערוץ</span><strong>Release Candidate</strong></div>
      <div class="row"><span>בסיס יציב</span><strong>v3.8.1</strong></div>
      <div class="row"><span>תאריך Build</span><strong>2026-08-02T13:16:07+00:00</strong></div>
    </section>

    <a class="back" href="index.html">← חזרה לאפליקציה</a>
    <footer>נבנה באהבה עבור מעיין ❤️</footer>
  </main>
</body>
</html>
